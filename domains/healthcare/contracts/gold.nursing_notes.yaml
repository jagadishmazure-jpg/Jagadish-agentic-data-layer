# Data contract: healthcare.gold.nursing_notes (owner: clinical-data). Synthetic, PHI-free data. Validated by adl.core.contracts in CI.
id: healthcare.gold.nursing_notes
version: 1.0.0
domain: healthcare
layer: gold
table: nursing_notes
kind: data_product
status: built
description: Redacted nursing notes keyed by the pseudonymous encounter key, with ward and region; encounter ids in the text are replaced by the key. Returned
  to agents quoted as untrusted data.
owner:
  team: clinical-data
  steward: Clinical data steward
  contact: clinical-data@halseyvale.example
classification: internal
schema:
- name: note_id
  type: string
  nullable: false
- name: encounter_key
  type: string
  nullable: false
- name: ward_id
  type: string
  nullable: false
- name: region
  type: string
  nullable: false
- name: day
  type: int
  nullable: false
- name: author_role
  type: string
  nullable: false
- name: text_redacted
  type: string
  nullable: false
- name: injection_flag
  type: bool
  nullable: false
primary_key: &id001
- note_id
quality:
- check: unique
  columns: *id001
slo:
  completeness_pct: 100
  freshness_days: 7
acceptable_use:
  allowed_purposes:
  - fall_prevention
  prohibited_purposes:
  - insurance_eligibility
  - employee_performance_management
  - medication_or_diagnosis_decisions
  - sale_of_data_to_third_parties
  - marketing
consumers:
- agent:fall-prevention-assistant
- agent:ward-copilot-north
- agent:ward-copilot-south
inputs:
- healthcare.silver.nursing_notes
- healthcare.silver.wards
agent_exposed: true
text_fields:
- text_redacted
