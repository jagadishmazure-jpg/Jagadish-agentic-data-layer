# Data contract: insurance.silver.postcode_groups (owner: claims-data). Validated by adl.core.contracts in CI.
id: insurance.silver.postcode_groups
version: 1.0.0
domain: insurance
layer: silver
table: postcode_groups
kind: conformed
status: built
description: 'Synthetic proxy group (G1 or G2) for each postcode district. Restricted: read only by the fairness audit, never a model feature and never
  exposed to agents.'
owner:
