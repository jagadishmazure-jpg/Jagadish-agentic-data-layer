- postcode_district
quality:
- check: unique
  columns: *id001
- check: accepted_values
  column: proxy_group
  values:
  - G1
  - G2
slo:
  completeness_pct: 100
  freshness_days: 365
inputs:
- insurance.bronze.postcode_groups
