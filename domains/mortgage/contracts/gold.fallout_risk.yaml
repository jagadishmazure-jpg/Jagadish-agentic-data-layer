# Data contract (PLANNED, nothing built yet): mortgage.gold.fallout_risk for the fictional Quillmere Home Loans. Validated by adl.core.contracts in CI.
id: mortgage.gold.fallout_risk
version: 0.1.0
domain: mortgage
layer: gold
table: fallout_risk
