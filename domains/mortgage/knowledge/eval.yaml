  - {id: M19, q: "What should we do when a broker reports a competing offer?", relevant: [CH-BROKER]}
  - {id: M20, q: "What happens when a lock expires and rates have risen?", relevant: [POL-LOCK, POL-RELOCK]}
  - {id: M21, q: "Which branch writes most jumbo loans?", relevant: [BR-B06, PROD-JUMBO]}
