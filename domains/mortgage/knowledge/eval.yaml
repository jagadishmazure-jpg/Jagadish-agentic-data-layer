# Retrieval evaluation set for the mortgage domain: questions a loan officer, processor or the assistant asks,
# with the documents that answer them. Written by the same author as the corpus, so scores are optimistic.
questions:
  - {id: M01, q: "How much does a lock extension cost and who approves it?", relevant: [POL-LOCK, POL-APPROVAL]}
  - {id: M02, q: "When should we relock instead of extending?", relevant: [POL-RELOCK, REV-BLANKET-EXT]}
  - {id: M03, q: "Who should loan officers call first?", relevant: [POL-OUTREACH]}
  - {id: M04, q: "Which documents slow processing down?", relevant: [POL-DOCS, REV-DOC-STALL]}
  - {id: M05, q: "Can the fallout score be used to decline a loan?", relevant: [POL-FAIR-LENDING]}
  - {id: M06, q: "Where do borrower phone numbers live?", relevant: [POL-PRIVACY]}
  - {id: M07, q: "Why do broker loans fall out more?", relevant: [CH-BROKER, REV-RALLY]}
  - {id: M08, q: "What went wrong during the rate rally?", relevant: [REV-RALLY]}
  - {id: M09, q: "Why are Saltmarsh locks expiring?", relevant: [BR-B04]}
