# Data contract: retail.gold.markdown_candidates (owner: merchandising-analytics). Validated by adl.core.contracts in CI.
id: retail.gold.markdown_candidates
version: 1.0.0
domain: retail
layer: gold
table: markdown_candidates
kind: insight_product
status: built
description: Near-date stock per store and product with the recommended markdown and the expected units cleared.
owner: {team: merchandising-analytics, steward: Merchandising data steward, contact: merch-data@wrenfield.example}
classification: internal
schema:
- {name: store_id, type: string, nullable: false}
- {name: sku, type: string, nullable: false}
- {name: category, type: string, nullable: false}
- {name: near_expiry_units, type: int, nullable: false}
- {name: forecast_units, type: float, nullable: false}
- {name: elasticity, type: float, nullable: false}
- {name: recommended_discount_pct, type: int, nullable: false}
- {name: current_rule_discount_pct, type: int, nullable: false}
- {name: expected_units_cleared, type: float, nullable: false}
primary_key: [store_id, sku]
quality:
- check: unique
  columns: [store_id, sku]
- {check: range, column: recommended_discount_pct, min: 0, max: 50}
- {check: referential, column: store_id, ref: retail.silver.stores.store_id}
- {check: referential, column: sku, ref: retail.silver.products.sku}
slo: {completeness_pct: 100, freshness_days: 9999, max_quarantine_pct: 1.0}
acceptable_use:
  allowed_purposes: [markdown_optimisation, store_operations]
  prohibited_purposes: [individual_customer_profiling, employee_performance_management, sale_of_data_to_third_parties]
consumers: ['agent:markdown']
inputs: [retail.gold.inventory_position, retail.gold.demand_forecast]
agent_exposed: true
