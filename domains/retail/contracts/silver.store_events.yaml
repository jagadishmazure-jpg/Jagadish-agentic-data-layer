# Data contract: retail.silver.store_events (owner: store-operations). Validated by adl.core.contracts in CI.
id: retail.silver.store_events
version: 1.0.0
domain: retail
layer: silver
table: store_events
kind: conformed
status: built
description: Local events near a store (festivals, fairs) that lift footfall, known ahead of time.
owner: {team: store-operations, steward: Store operations data steward, contact: store-ops-data@wrenfield.example}
classification: internal
schema:
- {name: store_id, type: string, nullable: false}
- {name: day, type: int, nullable: false}
- {name: event_type, type: string, nullable: false}
primary_key: [store_id, day]
quality:
- check: unique
  columns: [store_id, day]
- {check: referential, column: store_id, ref: retail.silver.stores.store_id}
slo: {completeness_pct: 100, freshness_days: 9999, max_quarantine_pct: 1.0}
inputs: [retail.bronze.store_events]
agent_exposed: false
