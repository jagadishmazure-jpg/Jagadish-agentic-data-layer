# Data contract: retail.gold.demand_forecast (owner: merchandising-analytics). Validated by adl.core.contracts in CI.
id: retail.gold.demand_forecast
version: 1.0.0
domain: retail
layer: gold
table: demand_forecast
kind: insight_product
status: built
description: Daily demand forecast per store and product for the next 14 days, with an 80% upper bound, from the ridge model in adl.domains.retail.forecast.
owner: {team: merchandising-analytics, steward: Merchandising data steward, contact: merch-data@wrenfield.example}
classification: internal
schema:
- {name: store_id, type: string, nullable: false}
- {name: sku, type: string, nullable: false}
- {name: day, type: int, nullable: false}
- {name: horizon, type: int, nullable: false}
- {name: forecast_units, type: float, nullable: false}
- {name: p90_units, type: float, nullable: false}
primary_key: [store_id, sku, day]
quality:
- check: unique
  columns: [store_id, sku, day]
- {check: range, column: forecast_units, min: 0}
- {check: referential, column: store_id, ref: retail.silver.stores.store_id}
- {check: referential, column: sku, ref: retail.silver.products.sku}
slo: {completeness_pct: 100, freshness_days: 9999, max_quarantine_pct: 1.0}
acceptable_use:
  allowed_purposes: [replenishment, markdown_optimisation, demand_forecasting, store_operations]
  prohibited_purposes: [individual_customer_profiling, employee_performance_management, sale_of_data_to_third_parties]
consumers: ['agent:replenishment', 'agent:markdown']
inputs: [retail.gold.sales_daily, retail.gold.promo_plan, retail.silver.weather, retail.silver.store_events, retail.silver.prices]
agent_exposed: true
