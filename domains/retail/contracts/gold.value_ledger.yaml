# Data contract: retail.gold.value_ledger (owner: finance-analytics). Validated by adl.core.contracts in CI.
id: retail.gold.value_ledger
version: 1.0.0
domain: retail
layer: gold
table: value_ledger
kind: insight_product
status: built
description: Business value by lever from the seeded forward simulation versus the current rules, with 95% intervals and the estimated AI and
  compute cost.
owner: {team: finance-analytics, steward: Finance data steward, contact: finance-data@wrenfield.example}
classification: internal
schema:
- {name: ledger_id, type: string, nullable: false}
- {name: lever, type: string, nullable: false}
- {name: metric, type: string, nullable: false}
- {name: baseline_usd, type: float, nullable: false}
- {name: agent_usd, type: float, nullable: false}
- {name: delta_usd, type: float, nullable: false}
- {name: ci_low_usd, type: float, nullable: false}
- {name: ci_high_usd, type: float, nullable: false}
- {name: replications, type: int, nullable: false}
- {name: horizon_days, type: int, nullable: false}
primary_key: [ledger_id]
quality:
- check: unique
  columns: [ledger_id]
slo: {completeness_pct: 100, freshness_days: 9999, max_quarantine_pct: 1.0}
acceptable_use:
  allowed_purposes: [value_reporting, performance_reporting]
  prohibited_purposes: [individual_customer_profiling, employee_performance_management, sale_of_data_to_third_parties]
consumers: ['agent:finance', FinOps export (FOCUS)]
inputs: [retail.gold.sales_daily, retail.gold.demand_forecast, retail.gold.supplier_performance]
agent_exposed: true
