# Data contract: retail.silver.pos_sales (owner: merchandising-analytics). Validated by adl.core.contracts in CI.
id: retail.silver.pos_sales
version: 1.0.0
domain: retail
layer: silver
table: pos_sales
kind: conformed
status: built
description: Point-of-sale sales per store, product and day after de-duplication of resent batches; rows failing the checks are quarantined.
owner: {team: merchandising-analytics, steward: Merchandising data steward, contact: merch-data@wrenfield.example}
classification: internal
schema:
- {name: store_id, type: string, nullable: false}
- {name: sku, type: string, nullable: false}
- {name: day, type: int, nullable: false}
- {name: units, type: int, nullable: false}
- {name: net_sales, type: float, nullable: false}
- {name: shelf_price, type: float, nullable: false}
- {name: markdown_units, type: int, nullable: false}
- {name: markdown_amount, type: float, nullable: false}
- {name: promo_flag, type: bool, nullable: false}
primary_key: [store_id, sku, day]
quality:
- check: unique
  columns: [store_id, sku, day]
- {check: range, column: units, min: 0}
- {check: range, column: net_sales, min: 0}
- {check: range, column: markdown_units, min: 0}
- {check: referential, column: store_id, ref: retail.silver.stores.store_id}
- {check: referential, column: sku, ref: retail.silver.products.sku}
- {check: freshness, column: day}
- {check: row_count_min, value: 50000}
slo: {completeness_pct: 99.9, freshness_days: 1, max_quarantine_pct: 1.0}
inputs: [retail.bronze.pos_sales]
agent_exposed: false
