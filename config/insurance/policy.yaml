# Decision policy for the claims assistant (adl.domains.insurance.policy). Code reads this file; agents cannot change it.
capacity:                     # the same capacity the teams have today; the assistant only changes how it is used
  adjuster_days: {fast_track: 18, standard: 58, complex: 46}
  reviews_per_day: 10
  referrals_per_day: 8
planning:                     # planning figures for expected adjuster-days per claim (from the claims operations manual)
  work: {fast_track: [1.0, 1.0], standard: [2.0, 4.0], complex: [2.5, 5.0]}   # [simple, complex]
  utilisation_target: 0.95
triage:                       # chosen on tuning seeds 4000-4009, never on the reported replications (docs/insurance/claims-models.md)
  complex_min_probability: 0.65         # rule: highest net value among grid settings that do not lengthen cycle time or widen backlog spread
  fast_track_max_probability: 0.25
  fast_track_max_estimate_usd: 5000
approval:                     # anything above a threshold waits for a named claims team lead; everything is dry-run
  # governance choices, set after one dry-run morning so the team lead sees the largest few proposals each day;
  # the value simulation assumes every proposal is approved (docs/insurance/agents-gateway.md)
  fast_track_estimate_usd: 2500           # a fast-track assignment for a claim estimated above this waits for the team lead
  referral_expected_recovery_usd: 3000    # a subrogation referral expected to recover more than this waits for the team lead
  reviews: never                          # leakage reviews are below every threshold
execution:
  mode: dry-run               # the live executor (claims system) is not implemented
