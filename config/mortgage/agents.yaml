# Agent identities for the mortgage domain and what each may read through the data gateway (adl.core.access).
# In Azure each identity is a Microsoft Entra ID agent identity / managed identity; here they are names.
# products: data products (gold, agent_exposed contracts) plus "knowledge" for the knowledge layer.
# purposes: must also be allowed by the product's contract; credit decisioning is prohibited in every contract.
# rows: row-level scope. region limits rows to that region's branches; omitted means every branch.
# deny_columns: column-level security per product.
identities:
  agent:mortgage-assistant:
    description: Plans borrower outreach, document chases and lock extensions for every branch.
    products: [lock_position, fallout_risk, pipeline_notes, pipeline_daily, knowledge]
    purposes: [pipeline_management]
    max_rows: 500
  agent:branch-copilot-north:
    description: Answers branch managers in the north region about their pipeline.
    products: [lock_position, fallout_risk, pipeline_notes, pipeline_daily, knowledge]
    purposes: [branch_operations]
    rows: {region: [north]}
    deny_columns: {lock_position: [loan_amount_usd], fallout_risk: [value_at_risk_usd]}
    max_rows: 200
  agent:branch-copilot-south:
    description: Answers branch managers in the south region about their pipeline.
    products: [lock_position, fallout_risk, pipeline_notes, pipeline_daily, knowledge]
    purposes: [branch_operations]
    rows: {region: [south]}
    deny_columns: {lock_position: [loan_amount_usd], fallout_risk: [value_at_risk_usd]}
    max_rows: 200
  agent:mortgage-finance:
    description: Reports pipeline performance and business value from the value ledger.
    products: [value_ledger, pipeline_daily]
    purposes: [value_reporting, performance_reporting]
    max_rows: 500
knowledge:
  allowed_purposes: [pipeline_management, branch_operations]
