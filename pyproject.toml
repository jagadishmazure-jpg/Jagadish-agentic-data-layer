[project]
name = "agentic-data-layer"
version = "0.1.0"
description = "AI-ready data products that agents consume safely, with the business value measured: a value case, medallion lakehouse with contracts and lineage, a metrics layer, forecasting and markdown models, GraphRAG retrieval, a governed MCP / A2A data gateway, human-approved replenishment and markdown agents, a value ledger and multi-cloud storage adapters. First domain: a fictional grocer."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jagadish Meduri" }]
requires-python = ">=3.13"
# Pinned to the versions the tests were run with, so seeded simulations reproduce exactly. No cloud SDK
# is a dependency: every cloud adapter imports its SDK lazily (see the optional extras).
dependencies = [
  "agent-framework-core==1.20.0", # Microsoft Agent Framework: workflows, executors, agents, HITL requests
  "mcp==2.3.0",                   # MCP data server
  "pydantic>=2.13,<3",            # contracts and structured model output
  "pyyaml==6.0.3",                # contracts, metrics, identities, policy
  "duckdb==1.5.6",                # local SQL engine over the lake
  "deltalake==1.6.6",             # Delta Lake tables written locally
  "pyarrow==25.0.1",              # columnar exchange between DuckDB and Delta
  "numpy==2.5.3",                 # simulation, forecasting, embeddings
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.10"]
foundry = ["agent-framework-foundry==1.14.0", "azure-identity>=1.25,<2"]
azure = ["azure-identity>=1.25,<2", "azure-search-documents>=11.6,<13", "databricks-sql-connector>=4,<5"]
gcp = ["google-cloud-bigquery>=3.30,<4", "google-cloud-storage>=3,<4"]
aws = ["boto3>=1.40,<2"]

[project.scripts]
adl = "adl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adl"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 150
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]
